name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 화면 동작·금지어·출처 표시·인증키 누출·응답 모양,
      # 디자인 원본(tokens·components·copy.json)과 DESIGN.md·index.html :root의 값 대조 (의존성 없음)
      - name: node --test
        run: node --test tests/*.test.mjs

      - name: 설정·훅 문법
        run: |
          jq empty .claude/settings.json
          bash -n .claude/hooks/after-edit.sh
          bash -n .claude/hooks/before-stop.sh

      # design-harness는 로컬 플러그인이라 CI에 없다. 아래 둘은 로컬(편집 훅·Stop 훅)에서만 돈다.
      # - lint:web: 렌더링한 화면의 토큰 밖 색·글자 크기, 44px 미만 버튼, 금지 카피
      # - check: DESIGN.md 글자 단위 최신 여부와 공식 린트, 단계 승인
      # PR 전에 `design-harness lint:web index.html`과 `design-harness check`를 돌려 확인한다.
