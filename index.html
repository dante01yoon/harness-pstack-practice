<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>서울 공영주차장 빈자리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  /* tokens.json (승인: system, dante, 2026-10-26) */
  :root {
    --color-brand: #0A4A94;
    --color-brand-soft: #E6EEF8;
    --color-on-brand: #FFFFFF;
    --color-text: #16202A;
    --color-text-muted: #475563;
    --color-surface: #FFFFFF;
    --color-surface-sunken: #F2F4F6;
    --color-border: #D3DAE1;
    --color-border-strong: #7A8794;
    --color-warning: #6E4300;
    --color-warning-soft: #FFF1D6;
    --color-danger: #B0261C;
    --color-danger-soft: #FCEBEA;
    --color-focus: #0A4A94;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;
    --radius-sm: 4px; --radius-md: 8px;
    --size-touch: 44px; --size-header: 48px; --size-input: 48px; --size-row: 96px;
    --size-icon: 20px; --size-icon-lg: 24px; --size-focus-ring: 2px;
    --font-size-caption: 13px; --font-size-label: 15px; --font-size-body: 16px;
    --font-size-title: 18px; --font-size-heading: 22px;
    --font-size-count: 32px; --font-size-count-lg: 48px;
    --font-weight-regular: 400; --font-weight-semibold: 600; --font-weight-bold: 700;
    --line-height-tight: 1.15; --line-height-snug: 1.35; --line-height-body: 1.5;
    --font-family-base: 'IBM Plex Sans KR', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--color-surface-sunken); color: var(--color-text);
    font-family: var(--font-family-base); font-size: var(--font-size-body);
    line-height: var(--line-height-body); -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 480px; min-height: 100vh; margin: 0 auto; background: var(--color-surface); display: flex; flex-direction: column; }
  main { flex: 1; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: var(--size-focus-ring) solid var(--color-focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .icon { width: var(--size-icon); height: var(--size-icon); flex: none; }
  .icon-lg { width: var(--size-icon-lg); height: var(--size-icon-lg); flex: none; }
  .num { font-variant-numeric: tabular-nums; }

  /* AppBar */
  .appbar {
    position: sticky; top: 0; z-index: 3; height: var(--size-header);
    display: flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-2) 0 var(--space-4);
    background: var(--color-surface); border-bottom: 1px solid var(--color-border);
  }
  .appbar.detail { padding-left: var(--space-1); }
  .appbar h1 {
    flex: 1; min-width: 0; margin: 0; font-size: var(--font-size-title); font-weight: var(--font-weight-bold);
    line-height: var(--line-height-snug); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* IconButton */
  .icon-btn {
    width: var(--size-touch); height: var(--size-touch); flex: none; display: inline-grid; place-items: center;
    border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-brand);
  }
  .icon-btn:active { background: var(--color-brand-soft); }
  .icon-btn[aria-busy="true"] svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SearchField */
  .search { padding: var(--space-3) var(--space-4) var(--space-1); }
  .search-box {
    display: flex; align-items: center; height: var(--size-input); padding-left: var(--space-3);
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); background: var(--color-surface);
    color: var(--color-text-muted);
  }
  .search-box:focus-within { outline: var(--size-focus-ring) solid var(--color-focus); outline-offset: 0; border-color: var(--color-focus); }
  .search-box input {
    flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
    padding: 0 var(--space-2); font-size: var(--font-size-body); color: var(--color-text);
  }
  .search-box input::placeholder { color: var(--color-text-muted); }
  .search-box input::-webkit-search-cancel-button { display: none; }
  .search-box .icon-btn { color: var(--color-text-muted); }

  /* DistrictChip */
  .chips {
    display: flex; gap: var(--space-2); overflow-x: auto; padding: var(--space-2) var(--space-4);
    scrollbar-width: none; scroll-padding: 0 var(--space-4);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--size-touch);
    padding: 0 var(--space-3); border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
    background: var(--color-surface); color: var(--color-text); font-size: var(--font-size-label); white-space: nowrap;
  }
  .chip:active { background: var(--color-brand-soft); }
  .chip[aria-pressed="true"] {
    background: var(--color-brand-soft); color: var(--color-brand); border-color: var(--color-brand);
    font-weight: var(--font-weight-semibold);
  }
  .chip .check { display: none; width: 16px; height: 16px; }
  .chip[aria-pressed="true"] .check { display: block; }

  /* ResultSummary */
  .summary {
    min-height: var(--size-touch); display: flex; align-items: center; padding: 0 var(--space-4);
    font-size: var(--font-size-label); color: var(--color-text-muted);
  }

  /* StaleBanner / inline error */
  .banner {
    display: flex; align-items: center; gap: var(--space-2); margin: 0 var(--space-4) var(--space-3);
    padding: var(--space-3); border: 1px solid var(--color-warning); border-radius: var(--radius-md);
    background: var(--color-warning-soft); color: var(--color-warning); font-size: var(--font-size-label);
    line-height: var(--line-height-snug);
  }
  .banner p { flex: 1; margin: 0; }
  .banner.danger { border-color: var(--color-danger); background: var(--color-danger-soft); color: var(--color-danger); }
  .detail-hero + .banner { margin-top: 0; }

  /* Button */
  .btn {
    flex: none; min-height: var(--size-touch); padding: 0 var(--space-4); border-radius: var(--radius-sm);
    font-size: var(--font-size-label); font-weight: var(--font-weight-semibold); white-space: nowrap;
    border: 1px solid var(--color-brand); background: var(--color-brand); color: var(--color-on-brand);
  }
  .btn.secondary { background: var(--color-surface); color: var(--color-brand); }
  .btn:active { filter: brightness(0.92); }
  .btn:disabled { cursor: default; opacity: 0.7; }

  /* GroupHeader */
  .group-header {
    position: sticky; top: var(--size-header); z-index: 2; height: calc(var(--space-8) + var(--space-2));
    display: flex; align-items: center; margin: 0; padding: 0 var(--space-4);
    background: var(--color-surface-sunken); font-size: var(--font-size-label); font-weight: var(--font-weight-semibold);
  }
  .list { list-style: none; margin: 0; padding: 0; }

  /* ParkingRow */
  .row {
    display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-row);
    padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border);
    color: inherit; text-decoration: none; background: var(--color-surface);
  }
  .row:active { background: var(--color-brand-soft); }
  .row:focus-visible { outline-offset: -2px; }
  .row-main { flex: 1; min-width: 0; }
  .row-name {
    margin: 0; font-size: var(--font-size-title); font-weight: var(--font-weight-semibold); line-height: var(--line-height-snug);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .row-addr {
    margin: var(--space-1) 0 0; font-size: var(--font-size-label); color: var(--color-text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); text-align: right; max-width: 52%; }

  /* AvailabilityCount */
  .avail-label { font-size: var(--font-size-label); color: var(--color-text-muted); line-height: var(--line-height-snug); }
  .avail { display: flex; align-items: baseline; gap: var(--space-1); justify-content: flex-end; }
  .avail-count { font-size: var(--font-size-count); font-weight: var(--font-weight-bold); line-height: var(--line-height-tight); }
  .avail-unit { font-size: var(--font-size-label); color: var(--color-text-muted); white-space: nowrap; }
  .avail-full { font-size: var(--font-size-label); font-weight: var(--font-weight-bold); color: var(--color-text); }
  .lg .avail-count { font-size: var(--font-size-count-lg); }
  .lg .avail { justify-content: flex-start; }

  /* Timestamp */
  .ts { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--font-size-label); color: var(--color-text-muted); white-space: nowrap; }
  .ts.stale { color: var(--color-warning); font-weight: var(--font-weight-semibold); }

  /* NoRealtimeTag / BusOnlyTag / type tags */
  .tag {
    display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-2);
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
    font-size: var(--font-size-label); line-height: var(--line-height-snug); color: var(--color-text); white-space: nowrap;
  }
  .tag.no-rt { border-style: dashed; background: var(--color-surface-sunken); }
  .tag.bus { background: var(--color-surface); }
  .tag-sub { font-size: var(--font-size-label); color: var(--color-text-muted); white-space: nowrap; }

  /* StateMessage / SkeletonRow */
  .state {
    margin: var(--space-3) var(--space-4); padding: var(--space-5); border-radius: var(--radius-md);
    background: var(--color-surface-sunken); display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2);
  }
  .state.error { background: var(--color-danger-soft); }
  .state.error > svg { color: var(--color-danger); }
  .state > svg { color: var(--color-text-muted); }
  .state h2 { margin: 0; font-size: var(--font-size-body); font-weight: var(--font-weight-semibold); }
  .state.error h2 { color: var(--color-danger); }
  .state p { margin: 0; font-size: var(--font-size-label); color: var(--color-text-muted); }
  .state .btn { margin-top: var(--space-2); }
  .skeleton { display: flex; align-items: center; gap: var(--space-3); min-height: var(--size-row); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); }
  .skeleton span { display: block; background: var(--color-surface-sunken); border-radius: var(--radius-sm); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }

  /* DetailHero / DetailSection / InfoRow */
  .detail-hero { padding: var(--space-4); border-bottom: 1px solid var(--color-border); display: flex; flex-direction: column; gap: var(--space-2); }
  .detail-hero h2 { margin: 0; font-size: var(--font-size-heading); font-weight: var(--font-weight-bold); line-height: var(--line-height-snug); }
  .tags { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .detail-hero .avail-block { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1); padding-top: var(--space-2); }
  .detail-hero .note { margin: 0; font-size: var(--font-size-label); color: var(--color-text-muted); }
  .section { padding: var(--space-4); border-bottom: 1px solid var(--color-border); }
  .section h3 { margin: 0 0 var(--space-1); font-size: var(--font-size-title); font-weight: var(--font-weight-semibold); line-height: var(--line-height-snug); }
  .info { display: flex; gap: var(--space-3); padding: var(--space-2) 0; margin: 0; align-items: baseline; }
  .info dt { flex: none; width: 96px; font-size: var(--font-size-label); color: var(--color-text-muted); }
  .info dd { flex: 1; min-width: 0; margin: 0; font-size: var(--font-size-body); }
  .info dd.unknown { color: var(--color-text-muted); }

  /* PhoneLink */
  .phone {
    display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--size-touch);
    color: var(--color-brand); font-weight: var(--font-weight-semibold); text-decoration: underline; text-underline-offset: 3px;
    border-radius: var(--radius-sm);
  }
  .phone:active { background: var(--color-brand-soft); }
  .info.phone-row { padding: 0; align-items: center; }

  /* SourceNote */
  .source { padding: var(--space-4); background: var(--color-surface-sunken); font-size: var(--font-size-caption); color: var(--color-text-muted); line-height: var(--line-height-body); }
  .source p { margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .skeleton span, .icon-btn[aria-busy="true"] svg { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <main id="view" tabindex="-1"></main>
  <footer class="source">
    <p>출처: 서울 열린데이터광장, 서울시 시영주차장 실시간 주차대수 정보 (공공누리 제1유형)</p>
  </footer>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
  <symbol id="i-no-signal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19v-2M10 19v-5M15 19v-8M20 19V7"/><path d="M3 4l18 16"/></symbol>
  <symbol id="i-bus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3.5" width="15" height="14" rx="2"/><path d="M4.5 11h15M8 20.5v-3M16 20.5v-3"/><path d="M8 14.5h.01M16 14.5h.01"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/></symbol>
</svg>

<script>
(() => {
  const DATA_URL = 'api/parking';
  const STALE_MS = 20 * 60 * 1000; // PRD F6: 기준 시각이 20분을 넘으면 오래됨
  const TZ = 'Asia/Seoul';

  const state = {
    status: 'loading',   // loading | ready | error
    lots: [],
    loadedAt: null,      // 목록을 불러온 시각
    refreshing: false,
    refreshFailed: false,
    query: '',
    district: '전체',
    listScroll: 0,
  };

  const view = document.getElementById('view');

  // ---------- 형식 ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const icon = (id, cls = 'icon') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const won = (n) => Number(n).toLocaleString('ko-KR');

  const kstParts = (d) => Object.fromEntries(
    new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
      .formatToParts(d).map((p) => [p.type, p.value]));
  const hhmm = (d) => { const p = kstParts(d); return `${p.hour}:${p.minute}`; };
  const sameKstDay = (a, b) => { const x = kstParts(a), y = kstParts(b); return x.year === y.year && x.month === y.month && x.day === y.day; };

  // NOW_PRK_VHCL_UPDT_TM은 'YYYY-MM-DD HH:MM:SS'(KST)
  const parseUpdated = (s) => {
    const m = /^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}(?::\d{2})?)$/.exec((s || '').trim());
    if (!m) return null;
    const d = new Date(`${m[1]}T${m[2]}+09:00`);
    return isNaN(d) ? null : d;
  };
  const tsLabel = (d) => {
    if (sameKstDay(d, new Date())) return `${hhmm(d)} 기준`;
    const p = kstParts(d);
    return `${p.month}월 ${p.day}일 ${hhmm(d)} 기준`;
  };

  const hours = (b, e) => {
    b = (b || '').trim(); e = (e || '').trim();
    if (!/^\d{4}$/.test(b) || !/^\d{4}$/.test(e)) return null;
    if (b === '0000' && e === '2400') return '24시간';
    if (b === e) return null; // '0000~0000' 등 의미 불명
    return `${b.slice(0, 2)}:${b.slice(2)}~${e.slice(0, 2)}:${e.slice(2)}`;
  };

  // ---------- 데이터 ----------
  const toLot = (r) => {
    const total = Number(r.TPKCT) || 0;
    const realtime = r.PRK_STTS_YN === '1';
    const busOnly = (r.OPER_SE_NM || '').trim() === '버스전용 주차장';
    const updated = realtime ? parseUpdated(r.NOW_PRK_VHCL_UPDT_TM) : null;
    const available = realtime ? total - (Number(r.NOW_PRK_VHCL_CNT) || 0) : null;
    const addr = (r.ADDR || '').trim();
    return {
      raw: r, id: String(r.PKLT_CD), name: (r.PKLT_NM || '').trim(), addr,
      district: addr.split(/\s+/)[0] || '정보 없음',
      total, realtime: realtime && Boolean(updated), busOnly, updated, available,
    };
  };
  const isStale = (lot) => lot.realtime && Date.now() - lot.updated.getTime() > STALE_MS;

  async function load() {
    const hadData = state.lots.length > 0;
    if (hadData) { state.refreshing = true; render(); } else { state.status = 'loading'; render(); }
    try {
      const res = await fetch(DATA_URL, { cache: 'no-store' });
      if (!res.ok) throw new TypeError(String(res.status));
      const body = await res.json();
      const rows = body?.GetParkingInfo?.row;
      if (!Array.isArray(rows)) throw new TypeError('rows');
      state.lots = rows.map(toLot);
      state.loadedAt = new Date();
      state.status = 'ready';
      state.refreshFailed = false;
    } catch (_) {
      if (hadData) state.refreshFailed = true; else state.status = 'error';
    } finally {
      state.refreshing = false;
      render();
    }
  }

  // ---------- 조각 ----------
  const refreshBtn = () => `
    <button class="icon-btn" type="button" data-act="refresh" aria-label="${state.refreshing ? '불러오는 중' : '새로고침'}" ${state.refreshing ? 'aria-busy="true"' : ''}>
      ${icon('refresh', 'icon-lg')}
    </button>`;

  const timestamp = (lot) => {
    const stale = isStale(lot);
    return `<span class="ts${stale ? ' stale' : ''}">${icon(stale ? 'warn' : 'clock')}<span class="num">${esc(tsLabel(lot.updated))}${stale ? ' · 20분 넘음' : ''}</span></span>`;
  };

  const noRealtimeTag = () => `<span class="tag no-rt">${icon('no-signal')}실시간 정보 없음</span>`;
  const busTag = () => `<span class="tag bus">${icon('bus')}버스전용</span>`;

  const availability = (lot, size) => {
    if (!lot.realtime) return noRealtimeTag();
    const full = lot.available <= 0;
    return `
      <span class="avail-label">빈자리</span>
      <span class="avail num">
        <span class="avail-count">${full ? 0 : won(lot.available)}</span>
        ${full ? '<span class="avail-full">만차</span>' : ''}
        <span class="avail-unit">/ 총 ${won(lot.total)}면</span>
      </span>`;
  };

  const banner = (kind, text, action) => `
    <div class="banner${kind === 'danger' ? ' danger' : ''}" role="status">
      ${icon('warn')}<p>${esc(text)}</p>
      ${action ? `<button class="btn secondary" type="button" data-act="refresh" ${state.refreshing ? 'disabled' : ''}>${state.refreshing ? '불러오는 중…' : '새로고침'}</button>` : ''}
    </div>`;

  const errorInline = () => state.refreshFailed
    ? banner('danger', `새 정보를 불러오지 못했어요. ${hhmm(state.loadedAt)} 기준 목록을 보여 드려요.`, false) : '';

  // ---------- 목록 ----------
  const norm = (s) => s.replace(/\s+/g, '').toLowerCase();
  const filtered = () => {
    const q = norm(state.query);
    return state.lots.filter((l) =>
      (state.district === '전체' || l.district === state.district) &&
      (!q || norm(l.name).includes(q) || norm(l.addr).includes(q)));
  };
  const districts = () => [...new Set(state.lots.map((l) => l.district))].sort((a, b) => a.localeCompare(b, 'ko'));

  const row = (lot) => {
    let side;
    if (lot.busOnly) side = `${busTag()}<span class="tag-sub">승용차 해당 없음</span>`;
    else if (!lot.realtime) side = noRealtimeTag();
    else side = `${availability(lot, 'row')}${timestamp(lot)}`;
    return `
      <li><a class="row" href="#/p/${encodeURIComponent(lot.id)}">
        <div class="row-main">
          <p class="row-name">${esc(lot.name)}</p>
          <p class="row-addr">${esc(lot.addr)}</p>
        </div>
        <div class="row-side">${side}</div>
      </a></li>`;
  };

  const skeletons = () => Array.from({ length: 4 }, () => `
    <div class="skeleton" aria-hidden="true">
      <div style="flex:1;display:grid;gap:8px"><span style="height:18px;width:70%"></span><span style="height:14px;width:50%"></span></div>
      <span style="width:72px;height:40px"></span>
    </div>`).join('');

  function listChrome() {
    const chips = ['전체', ...districts()].map((d) => `
      <button class="chip" type="button" data-district="${esc(d)}" aria-pressed="${state.district === d}">
        <svg class="check" aria-hidden="true"><use href="#i-check"/></svg>${esc(d)}
      </button>`).join('');
    return `
      <header class="appbar">
        <h1>서울 공영주차장 빈자리</h1>
        ${state.status === 'ready' ? refreshBtn() : ''}
      </header>
      <div class="search" role="search">
        <label class="search-box">
          ${icon('search')}
          <span class="sr-only">주차장 찾기</span>
          <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
                 placeholder="이름이나 주소로 찾기" value="${esc(state.query)}" ${state.status !== 'ready' ? 'disabled' : ''}>
          <button class="icon-btn" type="button" data-act="clear" aria-label="검색어 지우기" ${state.query ? '' : 'hidden'}>${icon('close')}</button>
        </label>
      </div>
      ${state.status === 'ready' ? `<nav class="chips" aria-label="구 선택">${chips}</nav>` : ''}
      <div id="results"></div>`;
  }

  function renderResults() {
    const box = document.getElementById('results');
    if (!box) return;
    if (state.status === 'loading') {
      box.innerHTML = `<p class="sr-only" role="status">불러오는 중</p>${skeletons()}`;
      return;
    }
    if (state.status === 'error') {
      box.innerHTML = `
        <div class="state error" role="alert">
          ${icon('warn', 'icon-lg')}
          <h2>주차장 정보를 불러오지 못했어요</h2>
          <p>인터넷 연결을 확인하고 다시 시도해 주세요.</p>
          <button class="btn" type="button" data-act="retry">다시 시도</button>
        </div>`;
      return;
    }
    const lots = filtered();
    const summary = `<p class="summary" role="status"><span class="num">${won(lots.length)}곳 · ${hhmm(state.loadedAt)}에 불러옴</span></p>`;
    if (!lots.length) {
      const q = state.query.trim();
      box.innerHTML = `${summary}
        <div class="state">
          ${icon('search', 'icon-lg')}
          <h2>찾는 주차장이 없어요</h2>
          <p>'${esc(q)}'와 맞는 이름·주소가 없어요. 구를 '전체'로 바꾸거나 다른 말로 찾아보세요.</p>
          <button class="btn secondary" type="button" data-act="clear">검색 지우기</button>
        </div>`;
      return;
    }
    const anyStale = lots.some((l) => !l.busOnly && isStale(l));
    const groups = new Map();
    for (const l of lots) { if (!groups.has(l.district)) groups.set(l.district, []); groups.get(l.district).push(l); }
    const ordered = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ko'));
    box.innerHTML = `${summary}
      ${errorInline()}
      ${anyStale ? banner('warning', '20분 넘게 지난 숫자가 있어요. 새로고침해 보세요.', true) : ''}
      ${ordered.map(([d, ls]) => `
        <section aria-label="${esc(d)}">
          <h2 class="group-header">${esc(d)} ${ls.length}곳</h2>
          <ul class="list">${ls.sort((a, b) => a.name.localeCompare(b.name, 'ko')).map(row).join('')}</ul>
        </section>`).join('')}`;
  }

  // ---------- 상세 ----------
  const info = (label, value) => value == null
    ? `<dl class="info"><dt>${esc(label)}</dt><dd class="unknown">정보 없음</dd></dl>`
    : `<dl class="info"><dt>${esc(label)}</dt><dd>${esc(value)}</dd></dl>`;
  const text = (v) => { const s = String(v ?? '').trim(); return s && s !== '*' ? s : null; };

  function feeRows(lot) {
    const r = lot.raw;
    if (r.PAY_YN === 'N') return info('요금', '무료');
    const p = lot.busOnly ? 'BUS_' : '';
    const bHr = Number(r[`${p}BSC_PRK_HR`]), bCrg = Number(r[`${p}BSC_PRK_CRG`]);
    const aHr = Number(r[`${p}ADD_PRK_HR`]), aCrg = Number(r[`${p}ADD_PRK_CRG`]);
    const day = Number(r.DAY_MAX_CRG), month = Number(r.PRD_AMT);
    return [
      info('기본 요금', bHr > 0 ? `${won(bHr)}분 ${won(bCrg)}원` : null),
      info('추가 요금', aHr > 0 ? `${won(aHr)}분마다 ${won(aCrg)}원` : null),
      day > 0 ? info('일 최대', `${won(day)}원`) : '', // DAY_MAX_CRG=0이면 줄을 그리지 않음
      info('월 정기권', month > 0 ? `월 ${won(month)}원` : null),
    ].join('');
  }

  function renderDetail(id) {
    const lot = state.lots.find((l) => l.id === id);
    const bar = (title) => `
      <header class="appbar detail">
        <button class="icon-btn" type="button" data-act="back" aria-label="목록으로">${icon('back', 'icon-lg')}</button>
        <h1>${esc(title)}</h1>
        ${state.status === 'ready' ? refreshBtn() : ''}
      </header>`;
    if (state.status === 'loading') { view.innerHTML = `${bar('')}<p class="sr-only" role="status">불러오는 중</p>${skeletons()}`; return; }
    if (state.status === 'error' || !lot) {
      view.innerHTML = `${bar('')}
        <div class="state error" role="alert">
          ${icon('warn', 'icon-lg')}
          <h2>주차장 정보를 불러오지 못했어요</h2>
          <p>인터넷 연결을 확인하고 다시 시도해 주세요.</p>
          <button class="btn" type="button" data-act="${state.status === 'error' ? 'retry' : 'back'}">${state.status === 'error' ? '다시 시도' : '목록으로'}</button>
        </div>`;
      return;
    }
    const r = lot.raw;
    const type = text(r.PRK_TYPE_NM);
    let hero;
    if (lot.busOnly) {
      hero = `<div class="avail-block lg"><span class="tag-sub">승용차 해당 없음</span>
        ${lot.realtime ? `${availability(lot, 'detail')}${timestamp(lot)}` : noRealtimeTag()}</div>`;
    } else if (!lot.realtime) {
      hero = `<div class="avail-block">${noRealtimeTag()}<p class="note">이 주차장은 빈자리 수를 보내지 않아요. 총 <span class="num">${won(lot.total)}</span>면</p></div>`;
    } else {
      hero = `<div class="avail-block lg">${availability(lot, 'detail')}${timestamp(lot)}</div>`;
    }
    const tel = text(r.TELNO);
    view.innerHTML = `${bar(lot.name)}
      <section class="detail-hero">
        <h2>${esc(lot.name)}</h2>
        <div class="tags">${type ? `<span class="tag">${esc(type)}</span>` : ''}${lot.busOnly ? busTag() : ''}</div>
        ${hero}
      </section>
      ${errorInline()}
      ${isStale(lot) ? banner('warning', '20분 넘게 지난 숫자예요. 지금은 다를 수 있어요.', true) : ''}
      <section class="section">
        <h3>전화·주소</h3>
        ${tel
          ? `<dl class="info phone-row"><dt>전화</dt><dd><a class="phone num" href="tel:${esc(tel.replace(/[^\d+]/g, ''))}" aria-label="전화 걸기 ${esc(tel)}">${icon('phone')}${esc(tel)}</a></dd></dl>`
          : info('전화', null)}
        ${info('주소', text(lot.addr))}
      </section>
      <section class="section">
        <h3>운영시간</h3>
        ${info('평일', hours(r.WD_OPER_BGNG_TM, r.WD_OPER_END_TM))}
        ${info('주말', hours(r.WE_OPER_BGNG_TM, r.WE_OPER_END_TM))}
        ${info('공휴일', hours(r.LHLDY_OPER_BGNG_TM, r.LHLDY_OPER_END_TM))}
      </section>
      <section class="section">
        <h3>요금</h3>
        ${feeRows(lot)}
      </section>
      <section class="section">
        <h3>유형·구분</h3>
        ${info('주차장 유형', type)}
        ${info('운영 구분', text(r.OPER_SE_NM))}
        ${info('유료·무료', text(r.PAY_YN_NM))}
      </section>
      <section class="section">
        <h3>토요일·공휴일·야간</h3>
        ${info('토요일', text(r.SAT_CHGD_FREE_NM))}
        ${info('공휴일', text(r.LHLDY_CHGD_FREE_SE_NAME))}
        ${info('야간', text(r.NGHT_PAY_YN_NM))}
      </section>`;
  }

  // ---------- 화면 전환 ----------
  const route = () => { const m = /^#\/p\/(.+)$/.exec(location.hash); return m ? decodeURIComponent(m[1]) : null; };
  let lastRoute;

  function render() {
    const id = route();
    const changed = id !== lastRoute;
    if (id) {
      if (changed && lastRoute == null) state.listScroll = window.scrollY;
      renderDetail(id);
      if (changed) window.scrollTo(0, 0);
    } else {
      const q = document.getElementById('q');
      const keepFocus = q && document.activeElement === q;
      view.innerHTML = listChrome();
      renderResults();
      view.querySelector('.chip[aria-pressed="true"]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (keepFocus) { const n = document.getElementById('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
      if (changed && lastRoute != null) window.scrollTo(0, state.listScroll);
    }
    lastRoute = id;
  }

  view.addEventListener('input', (e) => {
    if (e.target.id !== 'q') return;
    state.query = e.target.value;
    view.querySelector('[data-act="clear"]').hidden = !state.query;
    renderResults();
  });
  view.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-district]');
    if (chip) {
      state.district = chip.dataset.district;
      view.querySelectorAll('[data-district]').forEach((c) => c.setAttribute('aria-pressed', c === chip));
      renderResults();
      return;
    }
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'refresh' || act === 'retry') { if (!state.refreshing) load(); }
    else if (act === 'clear') { state.query = ''; state.district = '전체'; render(); document.getElementById('q')?.focus(); }
    else if (act === 'back') { if (history.state?.fromList) history.back(); else location.hash = ''; }
  });
  view.addEventListener('click', (e) => {
    const a = e.target.closest('a.row');
    if (a) { e.preventDefault(); history.pushState({ fromList: true }, '', a.getAttribute('href')); render(); }
  });
  window.addEventListener('popstate', render);
  window.addEventListener('hashchange', render);

  render();
  load();
})();
</script>
</body>
</html>
