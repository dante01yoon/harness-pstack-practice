<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서울 공영주차장 빈자리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
/* 토큰: work/seoul-parking/tokens.json (system 승인본) */
:root {
  --ink-900:#15191E; --ink-700:#3A4048; --ink-600:#4B525B; --ink-550:#5A616A; --ink-500:#6A717A; --ink-400:#80868E;
  --ink-300:#B9BEC5; --ink-200:#DADDE1; --ink-150:#E4E7EA; --ink-100:#ECEEF1; --ink-75:#EEF0F2; --ink-50:#F3F4F6; --white:#FFFFFF;
  --color-text:var(--ink-900); --color-text-muted:var(--ink-600); --color-text-disabled:var(--ink-550);
  --color-action:var(--ink-900); --color-on-action:var(--white);
  --color-surface:var(--white); --color-surface-sunken:var(--ink-50); --color-skeleton:var(--ink-150);
  --color-border:var(--ink-200); --color-border-float:var(--ink-300); --color-focus:var(--ink-900);
  --color-inverse:var(--ink-900); --color-on-inverse:var(--white);
  --color-danger:#B42318; --color-danger-soft:#FDECEA;
  --color-leader:var(--ink-600);
  --column-plenty:#0B7A5E; --column-some:#A86F00; --column-few:#C2410C; --column-full:#B0124A; --column-no-realtime:#6A717A;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --radius-tag:4px; --radius-sheet:20px; --radius-pill:999px;
  --size-touch:44px; --size-control:48px; --size-header:56px; --size-icon:24px; --size-swatch:4px; --leader-width:2px;
  --font:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --fs-caption:12px; --fs-label:14px; --fs-body:16px; --fs-title:20px; --fs-headline:28px; --fs-display:44px;
  --lh-tight:1.2; --lh-body:1.5;
  --ease-standard:cubic-bezier(.2,0,0,1); --ease-enter:cubic-bezier(.05,.7,.1,1); --ease-exit:cubic-bezier(.3,0,.8,.15);
  --d-press:100ms; --d-toggle:200ms; --d-view:320ms; --d-sheet:320ms; --d-toast:200ms; --d-spinner:900ms; --d-skeleton:1200ms;
  --press-scale:.96;
}
@media (prefers-reduced-motion: reduce) {
  :root { --d-press:0ms; --d-toggle:0ms; --d-view:150ms; --d-sheet:0ms; --d-toast:150ms; --press-scale:1; }
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--ink-75); }
body { font-family:var(--font); color:var(--color-text); font-size:var(--fs-body); line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; overflow:hidden; }
button { font:inherit; color:inherit; }
.app { position:relative; height:100%; max-width:480px; margin:0 auto; overflow:hidden; background:var(--ink-75); }
@media (min-width:481px) { .app { border-left:1px solid var(--color-border); border-right:1px solid var(--color-border); } }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible { outline:2px solid var(--color-focus); outline-offset:2px; }
.press { transition:transform var(--d-press) var(--ease-standard); }
.press:active { transform:scale(var(--press-scale)); }

/* 지도 */
#map { position:absolute; inset:0; }
.maplibregl-ctrl-attrib, .maplibregl-ctrl-logo { display:none !important; }
#labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
#labels svg { position:absolute; inset:0; width:100%; height:100%; }
.col-label { position:absolute; pointer-events:auto; display:flex; align-items:center; gap:var(--space-1);
  min-height:var(--size-touch); min-width:var(--size-touch); padding:0 var(--space-2) 0 calc(var(--space-2) + var(--size-swatch));
  background:var(--color-surface); border:1px solid var(--color-border-float); border-radius:var(--radius-tag);
  font-size:var(--fs-title); font-weight:700; line-height:var(--lh-tight); white-space:nowrap; cursor:pointer;
  transition:opacity var(--d-toggle) var(--ease-standard); }
.col-label::before { content:""; position:absolute; left:0; top:0; bottom:0; width:var(--size-swatch); background:var(--sw); border-radius:var(--radius-tag) 0 0 var(--radius-tag); }
.col-label.muted { font-size:var(--fs-label); font-weight:500; }
.col-label.highlighted { border-color:var(--ink-900); box-shadow:0 0 0 1px var(--ink-900); }

/* 위쪽 떠 있는 것 */
.top { position:absolute; left:var(--space-4); right:var(--space-4); top:calc(var(--space-4) + env(safe-area-inset-top)); z-index:5; display:flex; flex-direction:column; gap:var(--space-3); pointer-events:none; }
.top > * { pointer-events:auto; }
.searchbar { display:flex; align-items:center; gap:var(--space-2); height:var(--size-control); padding:0 var(--space-4);
  background:var(--color-surface); border:1px solid var(--color-border-float); border-radius:var(--radius-pill);
  font-size:var(--fs-body); color:var(--color-text-muted); text-align:left; cursor:pointer; width:100%; }
.row { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); }
.toggle { position:relative; display:inline-flex; padding:var(--space-1); background:var(--color-surface-sunken); border:1px solid var(--color-border-float); border-radius:var(--radius-pill); }
.toggle button { position:relative; z-index:1; min-width:68px; min-height:var(--size-touch); padding:0 var(--space-4); border:0; background:none; border-radius:var(--radius-pill);
  font-size:var(--fs-label); font-weight:700; cursor:pointer; }
.toggle button[aria-pressed="true"] { color:var(--color-on-action); }
.toggle button:disabled { color:var(--color-text-disabled); text-decoration:line-through; cursor:not-allowed; }
.toggle .thumb { position:absolute; top:var(--space-1); bottom:var(--space-1); left:var(--space-1); background:var(--color-action); border-radius:var(--radius-pill);
  transition:transform var(--d-toggle) var(--ease-standard), width var(--d-toggle) var(--ease-standard); }
.toast { align-self:stretch; padding:var(--space-3) var(--space-4); background:var(--color-inverse); color:var(--color-on-inverse);
  border-radius:var(--radius-tag); font-size:var(--fs-label); opacity:0; transform:translateY(-8px);
  transition:opacity var(--d-toast) var(--ease-standard), transform var(--d-toast) var(--ease-standard); pointer-events:none; }
.toast.show { opacity:1; transform:none; }
.toast[hidden] { display:none; }
.error-banner { padding:var(--space-3) var(--space-4); background:var(--color-danger-soft); color:var(--color-danger); border:1px solid var(--color-danger); border-radius:var(--radius-tag); font-size:var(--fs-label); }
.error-banner b { display:block; font-size:var(--fs-body); }
.error-banner button { margin-top:var(--space-2); }

/* 아래쪽 */
.bottom { position:absolute; left:0; right:0; bottom:0; z-index:4; display:flex; flex-direction:column; pointer-events:none; }
.bottom > * { pointer-events:auto; }
.fabs { align-self:flex-end; display:flex; flex-direction:column; gap:var(--space-3); margin:0 var(--space-4) var(--space-3); }
.fab, .icon-btn { width:var(--size-control); height:var(--size-control); display:grid; place-items:center; border-radius:var(--radius-pill);
  background:var(--color-surface); border:1px solid var(--color-border-float); cursor:pointer; padding:0; }
.fab[aria-disabled="true"] { background:var(--color-surface-sunken); color:var(--color-text-disabled); }
.fab svg, .icon-btn svg { width:var(--size-icon); height:var(--size-icon); }
.fab.spinning svg { animation:spin var(--d-spinner) linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .fab.spinning svg { animation:none; } }
.updated { align-self:flex-end; margin:0 var(--space-4) var(--space-3); display:inline-flex; align-items:center; gap:var(--space-2);
  padding:var(--space-1) var(--space-3); background:var(--color-surface); border:1px solid var(--color-border-float); border-radius:var(--radius-pill); font-size:var(--fs-label); }
.legend { margin:0 var(--space-4) var(--space-2); padding:var(--space-3) var(--space-4); background:var(--color-surface); border:1px solid var(--color-border-float); border-radius:var(--radius-tag); font-size:var(--fs-label); line-height:var(--lh-body); }
.legend .items { display:flex; flex-wrap:wrap; gap:var(--space-1) var(--space-3); margin-top:var(--space-1); }
.legend .sw { display:inline-block; width:12px; height:12px; margin-right:var(--space-1); vertical-align:-1px; border-radius:2px; }
.attrib { padding:var(--space-2) var(--space-4) calc(var(--space-2) + env(safe-area-inset-bottom)); background:var(--color-surface); border-top:1px solid var(--color-border); font-size:var(--fs-caption); color:var(--color-text-muted); }

/* 배지 */
.badge { display:inline-flex; align-items:center; gap:2px; padding:0 var(--space-1); border-radius:var(--radius-tag); font-size:var(--fs-caption); font-weight:500; line-height:20px; white-space:nowrap; vertical-align:middle; }
.badge.stale { background:var(--white); color:var(--ink-900); border:1px dashed var(--ink-900); }
.badge.muted { background:var(--ink-100); color:var(--ink-700); }

/* 목록 */
.list { position:absolute; inset:0; z-index:7; background:var(--color-surface); display:flex; flex-direction:column;
  transition:opacity var(--d-view) var(--ease-standard), transform var(--d-view) var(--ease-standard); }
.list[hidden] { display:flex; opacity:0; transform:translateY(24px); pointer-events:none; visibility:hidden; }
.list-head { padding:calc(var(--space-4) + env(safe-area-inset-top)) var(--space-4) var(--space-2); display:flex; flex-direction:column; gap:var(--space-3); border-bottom:1px solid var(--color-border); }
.list-body { flex:1; overflow:auto; }
.item { position:relative; display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--color-border);
  padding:var(--space-3) var(--space-8) var(--space-3) calc(var(--space-4) + var(--size-swatch)); min-height:96px; cursor:pointer; }
.item::before { content:""; position:absolute; left:0; top:var(--space-3); bottom:var(--space-3); width:var(--size-swatch); background:var(--sw); }
.item::after { content:"›"; position:absolute; right:var(--space-4); top:50%; transform:translateY(-50%); font-size:var(--fs-headline); color:var(--color-text-muted); }
.item .name { font-size:var(--fs-title); font-weight:700; line-height:var(--lh-tight); }
.item .vac { margin-top:var(--space-1); }
.item .vac b { font-size:var(--fs-headline); line-height:var(--lh-tight); }
.item .meta { font-size:var(--fs-label); color:var(--color-text-muted); }
.item.dim .vac b { opacity:.5; }

/* 상태 */
.state { padding:var(--space-8) var(--space-4); text-align:center; color:var(--color-text-muted); }
.state b { display:block; color:var(--color-text); font-size:var(--fs-title); margin-bottom:var(--space-2); }
.btn { min-height:var(--size-control); padding:0 var(--space-5); border-radius:var(--radius-pill); font-size:var(--fs-body); font-weight:700; cursor:pointer;
  border:1px solid var(--color-action); background:var(--color-surface); color:var(--color-text); }
.btn.primary { background:var(--color-action); color:var(--color-on-action); }
.btn[aria-disabled="true"] { opacity:.5; pointer-events:none; }
.skeleton { height:96px; border-bottom:1px solid var(--color-border); padding:var(--space-3) var(--space-4); }
.skeleton i { display:block; height:16px; margin:var(--space-2) 0; border-radius:var(--radius-tag); background:var(--color-skeleton); animation:pulse var(--d-skeleton) ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.5; } }
@media (prefers-reduced-motion: reduce) { .skeleton i { animation:none; } }
.loading-veil { position:absolute; inset:0; z-index:20; display:grid; place-items:center; background:var(--ink-75); color:var(--color-text-muted); font-size:var(--fs-body);
  transition:opacity var(--d-view) var(--ease-standard); }
.loading-veil.gone { opacity:0; pointer-events:none; }

/* 검색 */
.search { position:absolute; inset:0; z-index:8; background:var(--color-surface); display:flex; flex-direction:column; }
.search[hidden] { display:none; }
.search-head { display:flex; align-items:center; gap:var(--space-2); padding:calc(var(--space-4) + env(safe-area-inset-top)) var(--space-4) var(--space-2); }
.search-head input { flex:1; height:var(--size-control); padding:0 var(--space-4); border:1px solid var(--color-border-float); border-radius:var(--radius-pill); font:inherit; font-size:var(--fs-body); }
.search-scope { padding:0 var(--space-4) var(--space-2); font-size:var(--fs-label); color:var(--color-text-muted); border-bottom:1px solid var(--color-border); }
.result { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--color-border); padding:var(--space-3) var(--space-8) var(--space-3) var(--space-4); min-height:var(--size-touch); cursor:pointer; position:relative; }
.result::after { content:"›"; position:absolute; right:var(--space-4); top:50%; transform:translateY(-50%); font-size:var(--fs-title); color:var(--color-text-muted); }
.result .t { font-weight:700; }
.result .m { font-size:var(--fs-label); color:var(--color-text-muted); }
.result .n { font-weight:700; color:var(--color-text); }
.result.district { background:var(--color-surface-sunken); }

/* 상세 시트 */
.scrim { position:absolute; inset:0; z-index:9; background:rgba(21,25,30,.32); opacity:0; transition:opacity var(--d-sheet) var(--ease-standard); }
.scrim.show { opacity:1; }
.scrim[hidden] { display:none; }
.sheet { position:absolute; left:0; right:0; bottom:0; z-index:10; max-height:78%; display:flex; flex-direction:column;
  background:var(--color-surface); border-radius:var(--radius-sheet) var(--radius-sheet) 0 0; border-top:1px solid var(--color-border-float);
  transform:translateY(105%); transition:transform 420ms cubic-bezier(.2,1.1,.3,1); }
@media (prefers-reduced-motion: reduce) { .sheet { transition:none; } }
.sheet.open { transform:none; }
.sheet .handle { height:var(--size-touch); display:grid; place-items:center; cursor:grab; touch-action:none; border:0; background:none; width:100%; }
.sheet .handle::before { content:""; width:36px; height:4px; border-radius:2px; background:var(--ink-300); }
.sheet-body { overflow:auto; padding:0 var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom)); }
.sheet h2 { margin:0; font-size:var(--fs-title); line-height:var(--lh-tight); }
.sheet .addr { font-size:var(--fs-label); color:var(--color-text-muted); }
.sheet .big { margin-top:var(--space-4); }
.sheet .big .lbl { font-size:var(--fs-body); font-weight:700; margin-right:var(--space-2); }
.sheet .big b { font-size:var(--fs-display); line-height:var(--lh-tight); }
.sheet .big .tot { color:var(--color-text-muted); }
.sheet dl { margin:var(--space-4) 0 0; }
.sheet dl > div { display:grid; grid-template-columns:88px 1fr; padding:var(--space-3) 0; border-top:1px solid var(--color-border); }
.sheet dt { color:var(--color-text-muted); }
.sheet dd { margin:0; }
.sheet .actions { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3); margin-top:var(--space-4); }
.sheet .actions a { display:grid; place-items:center; text-decoration:none; }
.sheet .note { font-size:var(--fs-label); color:var(--color-text-muted); margin-top:var(--space-2); }
.sheet .close { position:absolute; right:var(--space-3); top:var(--space-2); }
</style>
</head>
<body>
<div class="app" id="app">
  <div id="map" role="application" aria-label="서울 공영주차장 3D 지도"></div>
  <div id="labels"><svg aria-hidden="true"></svg></div>

  <div class="top" id="top">
    <button class="searchbar press" id="openSearch" type="button">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <span>주차장 이름·구 검색 (예: 세종로, 종로구)</span>
    </button>
    <div class="row">
      <div class="toggle" role="group" aria-label="보기 전환">
        <span class="thumb" id="thumb"></span>
        <button type="button" id="tMap" aria-pressed="true">지도</button>
        <button type="button" id="tList" aria-pressed="false">목록</button>
      </div>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="error-banner" id="errorBanner" role="alert" hidden></div>
  </div>

  <div class="bottom" id="bottom">
    <div class="fabs">
      <button class="fab press" id="locate" type="button" aria-label="현위치로 이동">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path class="slash" d="M4 4l16 16" style="display:none"/></svg>
      </button>
    </div>
    <div class="row" style="justify-content:flex-end; align-items:flex-end; margin:0 var(--space-4) 0 0">
      <div class="updated" id="updated" role="status"></div>
      <button class="fab press" id="refresh" type="button" aria-label="새로고침" style="margin-bottom:var(--space-3)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
    <div class="legend" id="legend">
      <div>높이 = 빈자리 많을수록 높게 · 색 = 빈자리 비율</div>
      <div class="items">
        <span><i class="sw" style="background:var(--column-plenty)"></i>넉넉 50% 이상</span>
        <span><i class="sw" style="background:var(--column-some)"></i>보통 20–50%</span>
        <span><i class="sw" style="background:var(--column-few)"></i>적음 20% 미만</span>
        <span><i class="sw" style="background:var(--column-full)"></i>0</span>
        <span><i class="sw" style="background:var(--column-no-realtime)"></i>회색 = 실시간 정보 없음</span>
        <span><i class="sw" style="background:var(--column-plenty);opacity:.35"></i>흐린 기둥 = 오래됨(20분 넘음)</span>
      </div>
    </div>
    <div class="attrib">서울 열린데이터광장 · © OpenFreeMap © OpenMapTiles © OpenStreetMap contributors</div>
  </div>

  <section class="list" id="list" hidden aria-label="주차장 목록">
    <div class="list-head">
      <div class="row">
        <div class="toggle" role="group" aria-label="보기 전환">
          <span class="thumb" id="thumb2"></span>
          <button type="button" id="tMap2" aria-pressed="false">지도</button>
          <button type="button" id="tList2" aria-pressed="true">목록</button>
        </div>
        <button class="icon-btn press" id="refresh2" type="button" aria-label="새로고침">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
        </button>
      </div>
      <button class="searchbar press" id="openSearch2" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span>주차장 이름·구 검색 (예: 세종로, 종로구)</span>
      </button>
      <div class="row">
        <div class="toggle" role="group" aria-label="정렬">
          <span class="thumb" id="thumbSort"></span>
          <button type="button" id="sDist" aria-pressed="false">거리순</button>
          <button type="button" id="sVac" aria-pressed="true">빈자리순</button>
        </div>
      </div>
      <div class="meta" id="listUpdated" style="font-size:var(--fs-label)"></div>
      <div class="toast" id="toast2" role="status" hidden></div>
    </div>
    <div class="list-body" id="listBody"></div>
    <div class="attrib">서울 열린데이터광장 · © OpenFreeMap © OpenMapTiles © OpenStreetMap contributors</div>
  </section>

  <section class="search" id="search" hidden aria-label="검색">
    <div class="search-head">
      <button class="icon-btn press" id="closeSearch" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <input id="q" type="search" placeholder="주차장 이름·구 검색 (예: 세종로, 종로구)" autocomplete="off" aria-label="주차장 이름·구 검색">
    </div>
    <div class="search-scope">주소·장소는 검색하지 않습니다</div>
    <div class="list-body" id="results"></div>
  </section>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
    <button class="handle" id="handle" type="button" aria-label="시트 끌어서 닫기"></button>
    <button class="icon-btn close press" id="closeSheet" type="button" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="loading-veil" id="veil" role="status">불러오는 중</div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
"use strict";
// ---- 토큰에서 온 값 ----
const T = {
  staleAfterMin: 20,
  pitch: 55, pitchReduced: 45, bearing: -20,
  minPx: 24, maxPx: 170,               // size.column-min-height / column-max-height
  labelOffsetMax: 64,                  // size.label-offset-max
  dur: { flight: 2400, toResult: 1200, rise: 700, stagger: 320, height: 600, toastHold: 4000 },
  ease: { standard: [0.2, 0, 0, 1], enter: [0.05, 0.7, 0.1, 1], camera: [0.45, 0.05, 0.15, 1] },
  color: {
    plenty: "#0B7A5E", some: "#A86F00", few: "#C2410C", full: "#B0124A", "no-realtime": "#6A717A",
    ground: "#EEF0F2", building: "#DADDE1", road: "#FFFFFF", water: "#ECEEF1", label: "#5A616A", shadow: "#15191E", leader: "#4B525B"
  },
  opacity: { stale: 0.35, shadow: 0.08 },
};
const CITY_HALL = [126.9779, 37.5663];
const ARRIVE = [126.9835, 37.5685]; // 시청 근처(시청–종각 사이) 도착점
const SEOUL = [126.99, 37.55];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- 상태 ----
const S = { rows: [], maxVac: 1, view: "map", sort: "vacancy", user: null, geoDenied: false, selected: null, heightM: null, anim: new Map() };

// ---- 도우미 ----
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function bezier([x1, y1, x2, y2]) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t, dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => { let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-5 || !d) break; t -= e / d; } return sy(Math.min(1, Math.max(0, t))); };
}
const EASE = { standard: bezier(T.ease.standard), enter: bezier(T.ease.enter), camera: bezier(T.ease.camera) };

// 기준 시각(한국 시간 문자열) → Date
const kst = (s) => (s ? new Date(s.replace(" ", "T") + "+09:00") : null);
const isStale = (r) => r.live && r.updatedAt && Date.now() - kst(r.updatedAt).getTime() > T.staleAfterMin * 60000;
function band(r) {
  if (!r.live) return "no-realtime";
  if (r.vacant === 0) return "full";
  const ratio = r.vacant / r.total;
  return ratio >= 0.5 ? "plenty" : ratio >= 0.2 ? "some" : "few";
}
const addr = (a) => a.replace(/ 0$/, "");
const hm = (s) => s.slice(0, 2) + ":" + s.slice(2);
function hours([b, e]) {
  if (b === "0000" && e === "2400") return "24시간";
  if (b === "0000" && e === "0000") return "시간 정보 없음";
  return `${hm(b)}–${hm(e)}`;
}
const timeOnly = (s) => s.slice(11);
function oldest(rows) {
  const ts = rows.filter((r) => r.live && r.updatedAt).map((r) => r.updatedAt).sort();
  return ts[0] || null;
}
function distM(a, b) {
  const R = 6371000, toR = Math.PI / 180, dLat = (b[1] - a[1]) * toR, dLng = (b[0] - a[0]) * toR;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * toR) * Math.cos(b[1] * toR) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = (m) => (m < 1000 ? `${Math.round(m / 10) * 10}m` : `${(m / 1000).toFixed(1)}km`);

// ---- 기둥 높이: 최소 + (최대 − 최소) × √(빈자리 ÷ 서울 전체 최대 빈자리) ----
function columnPx(r) {
  if (!r.live) return T.minPx;
  if (r.vacant === 0) return 0;
  return T.minPx + (T.maxPx - T.minPx) * Math.sqrt(r.vacant / S.maxVac);
}
// 첫 진입 도착 카메라 기준으로 화면 px → 미터를 한 번 환산해 고정한다.
function pxToMetersAt(zoom, lat, pitchDeg) {
  const mpp = (40075016.686 * Math.cos((lat * Math.PI) / 180)) / (512 * 2 ** zoom);
  return mpp / Math.sin((pitchDeg * Math.PI) / 180);
}

// ---- 지오메트리 ----
function ring(lng, lat, rM, n = 12) {
  const dLat = rM / 111320, dLng = rM / (111320 * Math.cos((lat * Math.PI) / 180)), pts = [];
  for (let i = 0; i <= n; i++) { const a = (i / n) * 2 * Math.PI + Math.PI / n; pts.push([lng + dLng * Math.cos(a), lat + dLat * Math.sin(a)]); }
  return pts;
}
function hull(points) {
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]), cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  const h = lo.slice(0, -1).concat(up.slice(0, -1)); h.push(h[0]); return h;
}
const COL_R = 26; // 기둥 반지름(m)
function columnsGeoJSON(factor = (r) => 1) {
  const cols = [], shadows = [];
  for (const r of S.rows) {
    if (r.lat == null) continue;
    const f = factor(r), h = columnPx(r) * S.heightM * f, b = band(r), stale = isStale(r);
    S.anim.set(r.code, f);
    const base = ring(r.lng, r.lat, COL_R);
    const props = { code: r.code, band: b, stale, h: r.vacant === 0 && r.live ? 1.5 : h, color: T.color[b] };
    cols.push({ type: "Feature", properties: props, geometry: { type: "Polygon", coordinates: [base] } });
    if (props.h > 2) {
      // 광원은 화면 왼쪽 위 → 그림자는 바닥 오른쪽 아래, 길이는 높이에 비례
      const L = props.h * 0.45, br = ((T.bearing + 135) * Math.PI) / 180;
      const dx = (L * Math.sin(br)) / (111320 * Math.cos((r.lat * Math.PI) / 180)), dy = (L * Math.cos(br)) / 111320;
      const moved = base.map(([x, y]) => [x + dx, y + dy]);
      shadows.push({ type: "Feature", properties: { op: T.opacity.shadow * (stale ? T.opacity.stale : 1) }, geometry: { type: "Polygon", coordinates: [hull(base.concat(moved))] } });
    }
  }
  return { cols: { type: "FeatureCollection", features: cols }, shadows: { type: "FeatureCollection", features: shadows } };
}

// ---- 지도 ----
let map = null;
function webglOK() {
  try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); } catch { return false; }
}
function styleMap() {
  const style = map.getStyle();
  for (const l of style.layers) {
    try {
      if (l.type === "background") map.setPaintProperty(l.id, "background-color", T.color.ground);
      else if (l.type === "fill" && l["source-layer"] === "water") map.setPaintProperty(l.id, "fill-color", T.color.water);
      else if (l.type === "fill" && l["source-layer"] === "building") map.setLayoutProperty(l.id, "visibility", "none");
      else if (l.type === "line" && l["source-layer"] === "transportation" && /inner|minor|major|motorway/.test(l.id)) map.setPaintProperty(l.id, "line-color", T.color.road);
      else if (l.type === "symbol") {
        if (l["source-layer"] === "place") {
          map.setLayoutProperty(l.id, "text-field", ["coalesce", ["get", "name:ko"], ["get", "name"]]);
          map.setPaintProperty(l.id, "text-color", T.color.label);
        } else map.setLayoutProperty(l.id, "visibility", "none");
      }
    } catch { /* 스타일에 없는 속성은 건너뜀 */ }
  }
  // 3D 건물: 연한 무채색(map.building), 기둥보다 눈에 덜 띄게
  map.addLayer({
    id: "buildings-3d", type: "fill-extrusion", source: "openmaptiles", "source-layer": "building", minzoom: 13,
    paint: {
      "fill-extrusion-color": T.color.building,
      "fill-extrusion-height": ["coalesce", ["get", "render_height"], 8],
      "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
      "fill-extrusion-opacity": 0.9,
    },
  });
  map.setLight({ anchor: "viewport", position: [1.3, 225, 40], color: "#FFFFFF", intensity: 0.35 });
}
function addColumnLayers() {
  const g = columnsGeoJSON(() => (reduced ? 1 : 0));
  map.addSource("shadows", { type: "geojson", data: g.shadows });
  map.addSource("columns", { type: "geojson", data: g.cols });
  map.addLayer({ id: "column-shadows", type: "fill", source: "shadows", paint: { "fill-color": T.color.shadow, "fill-opacity": ["get", "op"] } }, "buildings-3d");
  const paint = { "fill-extrusion-color": ["get", "color"], "fill-extrusion-height": ["get", "h"], "fill-extrusion-base": 0, "fill-extrusion-vertical-gradient": true };
  map.addLayer({ id: "columns-fresh", type: "fill-extrusion", source: "columns", filter: ["!", ["get", "stale"]], paint: { ...paint, "fill-extrusion-opacity": 1 } });
  map.addLayer({ id: "columns-stale", type: "fill-extrusion", source: "columns", filter: ["get", "stale"], paint: { ...paint, "fill-extrusion-opacity": T.opacity.stale } });
  for (const id of ["columns-fresh", "columns-stale"]) {
    map.on("click", id, (e) => { const f = e.features[0]; if (f) openDetail(f.properties.code); });
    map.on("mouseenter", id, () => (map.getCanvas().style.cursor = "pointer"));
    map.on("mouseleave", id, () => (map.getCanvas().style.cursor = ""));
  }
}
function setColumns(factorFn) {
  const g = columnsGeoJSON(factorFn);
  map.getSource("columns").setData(g.cols);
  map.getSource("shadows").setData(g.shadows);
  placeLabels();
}
// 기둥 솟음(enter 이징, 순서대로 최대 320ms 안에 퍼짐). reduced-motion이면 최종 높이로 바로.
function riseColumns(duration = T.dur.rise, ease = EASE.enter) {
  if (reduced) { setColumns(() => 1); return; }
  const order = S.rows.filter((r) => r.lat != null).sort((a, b) => b.vacant - a.vacant);
  const delay = new Map(order.map((r, i) => [r.code, (i / Math.max(1, order.length - 1)) * T.dur.stagger]));
  const t0 = performance.now();
  const step = (now) => {
    const t = now - t0;
    setColumns((r) => ease(Math.min(1, Math.max(0, (t - delay.get(r.code)) / duration))));
    if (t < duration + T.dur.stagger) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---- 라벨(자기 기둥 위 + 지시선, 겹치면 비키고, 자리가 없을 때만 생략) ----
let labelRaf = 0;
function placeLabels() {
  if (labelRaf) return;
  labelRaf = requestAnimationFrame(() => { labelRaf = 0; doPlaceLabels(); });
}
function uiRects() {
  const app = $("app").getBoundingClientRect();
  return ["top", "bottom"].flatMap((id) => [...$(id).querySelectorAll(":scope > *:not([hidden]), .fabs > *, .row > *")])
    .map((el) => el.getBoundingClientRect()).filter((r) => r.width && r.height)
    .map((r) => ({ x: r.left - app.left, y: r.top - app.top, w: r.width, h: r.height }));
}
const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
function doPlaceLabels() {
  const layer = $("labels"), svg = layer.querySelector("svg");
  layer.querySelectorAll(".col-label").forEach((n) => n.remove());
  svg.innerHTML = "";
  if (!map || S.view !== "map") return;
  const W = layer.clientWidth, H = layer.clientHeight, zoom = map.getZoom(), pitch = map.getPitch();
  const mpp = (40075016.686 * Math.cos((37.56 * Math.PI) / 180)) / (512 * 2 ** zoom);
  const k = Math.sin((pitch * Math.PI) / 180) / mpp;
  const blocked = uiRects();
  // 기둥 꼭대기가 위쪽 떠 있는 UI 뒤로 숨으면, 보이는 부분 맨 위에 라벨을 건다
  const topUI = $("top").querySelector(".row").getBoundingClientRect().bottom - $("app").getBoundingClientRect().top;
  const minTop = topUI + 44 + 10 + 8;
  const cand = [];
  for (const r of S.rows) {
    if (r.lat == null) continue;
    const p = map.project([r.lng, r.lat]);
    if (p.x < -40 || p.x > W + 40 || p.y < -40 || p.y > H + 40) continue;
    const anim = S.anim.get(r.code) ?? 1;
    const hM = r.vacant === 0 && r.live ? 0 : columnPx(r) * S.heightM * anim;
    const topY = Math.max(p.y - hM * k, Math.min(p.y - 8, minTop));
    cand.push({ r, base: p, top: { x: p.x, y: topY } });
  }
  const pri = (c) => (c.r.code === S.selected ? 3e6 : !c.r.live ? -1 : c.r.vacant === 0 ? 0.5 : 1e3 + c.r.vacant);
  cand.sort((a, b) => pri(b) - pri(a));
  // 기둥 꼭대기 자체도 라벨이 덮으면 안 되는 자리
  const tops = cand.map((c) => ({ x: c.top.x - 10, y: c.top.y - 6, w: 20, h: 12, code: c.r.code }));
  const placed = [];
  const M = T.labelOffsetMax;
  for (const c of cand) {
    const el = document.createElement("button");
    const b = band(c.r), stale = isStale(c.r);
    el.type = "button";
    el.className = "col-label" + (c.r.live ? "" : " muted") + (c.r.code === S.selected ? " highlighted" : "");
    el.style.setProperty("--sw", T.color[b]);
    el.innerHTML = c.r.live ? `${c.r.vacant}${stale ? ' <span class="badge stale">오래됨</span>' : ""}` : "실시간 정보 없음";
    el.setAttribute("aria-label", c.r.live
      ? `${c.r.name}, 빈자리 ${c.r.vacant}면, 총 ${c.r.total}면, 기준 ${c.r.updatedAt}${stale ? ", 오래됨" : ""}`
      : `${c.r.name}, 실시간 정보 없음`);
    el.addEventListener("click", () => openDetail(c.r.code));
    el.style.visibility = "hidden";
    layer.appendChild(el);
    const w = el.offsetWidth, h = el.offsetHeight, gap = 10;
    const ax = c.top.x - w / 2, ay = c.top.y - gap - h;
    const tries = [[0, 0], [0, -M / 2], [0, -M], [-M / 2, -M / 2], [-M, -M / 2], [M / 2, -M / 2], [M, -M / 2], [-w / 2 - 14, h / 2 + gap], [w / 2 + 14, h / 2 + gap]];
    let spot = null;
    for (const [dx, dy] of tries) {
      const rect = { x: Math.min(Math.max(ax + dx, 4), W - 4 - w), y: ay + dy, w, h };
      if (rect.x < 4 || rect.y < 4 || rect.x + w > W - 4 || rect.y + h > H - 4) continue;
      if (blocked.some((u) => overlap(rect, u))) continue;
      if (placed.some((u) => overlap(rect, { x: u.x - 2, y: u.y - 2, w: u.w + 4, h: u.h + 4 }))) continue;
      if (tops.some((t) => t.code !== c.r.code && overlap(rect, t))) continue;
      spot = rect; break;
    }
    if (!spot) { el.remove(); continue; }
    placed.push(spot);
    el.style.left = spot.x + "px"; el.style.top = spot.y + "px"; el.style.visibility = "visible";
    if (stale) el.style.opacity = 1;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    const lx = Math.min(Math.max(c.top.x, spot.x + 6), spot.x + w - 6), ly = spot.y + h;
    line.setAttribute("x1", lx); line.setAttribute("y1", ly > c.top.y ? spot.y : ly);
    line.setAttribute("x2", c.top.x); line.setAttribute("y2", c.top.y);
    line.setAttribute("stroke", T.color.leader); line.setAttribute("stroke-width", 2);
    svg.appendChild(line);
  }
}

// ---- 위·아래 UI ----
function setToggle(thumb, active) {
  thumb.style.width = active.offsetWidth + "px";
  thumb.style.transform = `translateX(${active.offsetLeft - 4}px)`;
}
function syncToggles() {
  const m = S.view === "map";
  for (const [a, b, th] of [[$("tMap"), $("tList"), $("thumb")], [$("tMap2"), $("tList2"), $("thumb2")]]) {
    a.setAttribute("aria-pressed", m); b.setAttribute("aria-pressed", !m); setToggle(th, m ? a : b);
  }
  const d = S.sort === "distance";
  $("sDist").setAttribute("aria-pressed", d); $("sVac").setAttribute("aria-pressed", !d);
  setToggle($("thumbSort"), d ? $("sDist") : $("sVac"));
}
let toastTimer = 0;
function toast(msg) {
  const el = S.view === "map" ? $("toast") : $("toast2");
  for (const t of [$("toast"), $("toast2")]) { t.hidden = true; t.classList.remove("show"); }
  el.textContent = msg; el.hidden = false; requestAnimationFrame(() => el.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove("show"); setTimeout(() => { el.hidden = true; placeLabels(); }, 200); }, T.dur.toastHold);
  placeLabels();
}
function visibleRows() {
  if (!map) return S.rows;
  const b = map.getBounds();
  return S.rows.filter((r) => r.lat != null && b.contains([r.lng, r.lat]));
}
function renderUpdated() {
  const o = oldest(S.view === "map" ? visibleRows() : listRows().filter((r) => r.lat != null || true));
  const stale = o && Date.now() - kst(o).getTime() > T.staleAfterMin * 60000;
  const txt = o ? `가장 오래된 정보 기준 ${timeOnly(o)}${stale ? ' <span class="badge stale">오래됨</span>' : ""}` : "";
  $("updated").innerHTML = txt; $("updated").hidden = !o;
  $("listUpdated").innerHTML = txt;
}
function setView(v) {
  if (v === "map" && !map) { toast("이 기기에서는 3D 지도를 쓸 수 없어 목록으로 시작합니다"); return; }
  S.view = v;
  $("list").hidden = v !== "list";
  syncToggles();
  if (v === "list") renderList();
  renderUpdated(); placeLabels();
}

// ---- 목록 ----
function listRows() {
  const inView = map ? visibleRows() : S.rows.filter((r) => r.lat != null);
  const noLoc = S.rows.filter((r) => r.lat == null);
  const live = (r) => (r.live ? 1 : 0);
  let rows = inView.slice();
  if (S.sort === "distance" && S.user) rows.sort((a, b) => distM(S.user, [a.lng, a.lat]) - distM(S.user, [b.lng, b.lat]));
  else rows.sort((a, b) => live(b) - live(a) || b.vacant - a.vacant);
  return rows.concat(noLoc);
}
function itemHTML(r) {
  const b = band(r), stale = isStale(r);
  const vac = r.live
    ? `빈자리 <b>${r.vacant}</b> / 총 ${r.total}면 ${stale ? '<span class="badge stale">오래됨</span>' : ""}`
    : `<span class="badge muted">실시간 정보 없음</span> 총 ${r.total}면`;
  const fee = r.paid ? `기본 ${r.basicFee}원/${r.basicMin}분` : "무료";
  const dist = S.sort === "distance" && S.user && r.lat != null ? ` · ${fmtDist(distM(S.user, [r.lng, r.lat]))}` : "";
  const loc = r.lat == null ? ' · <span class="badge muted">지도 위치 없음</span>' : "";
  return `<button class="item press${r.live ? "" : " dim"}" type="button" data-code="${r.code}" style="--sw:${T.color[b]}">
    <div class="name">${esc(r.name)}</div>
    <div class="vac">${vac}</div>
    <div class="meta">${esc(r.gu)} · ${fee}${dist}${loc}</div>
    ${r.live && r.updatedAt ? `<div class="meta">기준 ${r.updatedAt}</div>` : ""}
  </button>`;
}
function renderList() {
  const rows = listRows(), body = $("listBody");
  if (!rows.length) {
    body.innerHTML = `<div class="state"><b>이 화면 안에 주차장이 없습니다</b>지도를 옮기거나 검색에서 찾으세요<br><br><button class="btn primary press" type="button" id="emptySearch">검색</button></div>`;
    $("emptySearch").onclick = openSearch;
    return;
  }
  body.innerHTML = rows.map(itemHTML).join("");
  body.querySelectorAll(".item").forEach((el) => (el.onclick = () => openDetail(el.dataset.code)));
}
function listSkeleton() {
  $("listBody").innerHTML = Array.from({ length: 5 }, () => `<div class="skeleton"><i style="width:60%"></i><i style="width:40%"></i><i style="width:50%"></i></div>`).join("");
}

// ---- 검색(이름·구만) ----
function openSearch() { $("search").hidden = false; $("q").value = ""; renderResults(""); setTimeout(() => $("q").focus(), 0); }
function closeSearch() { $("search").hidden = true; }
function renderResults(q) {
  const box = $("results"); q = q.trim();
  if (!q) { box.innerHTML = ""; return; }
  const gus = [...new Set(S.rows.map((r) => r.gu))].filter((g) => g.includes(q) || g.replace(/구$/, "") === q);
  const lots = S.rows.filter((r) => r.name.includes(q) || r.gu.includes(q));
  if (!gus.length && !lots.length) {
    box.innerHTML = `<div class="state"><b>‘${esc(q)}’에 맞는 주차장이나 구가 없습니다</b>주차장 이름이나 구 이름으로 다시 검색하세요<br><br><button class="btn press" type="button" id="toList">목록에서 찾기</button></div>`;
    $("toList").onclick = () => { closeSearch(); setView("list"); };
    return;
  }
  box.innerHTML =
    gus.map((g) => `<button class="result district press" type="button" data-gu="${esc(g)}"><div class="t">${esc(g)}</div><div class="m">${esc(g)} · 주차장 ${S.rows.filter((r) => r.gu === g).length}곳</div></button>`).join("") +
    lots.map((r) => {
      const stale = isStale(r);
      const v = r.live ? `빈자리 <span class="n">${r.vacant}</span> / 총 ${r.total}면${stale ? ' <span class="badge stale">오래됨</span>' : ""}` : '<span class="badge muted">실시간 정보 없음</span>';
      return `<button class="result press" type="button" data-code="${r.code}"><div class="t">${esc(r.name)}</div><div class="m">${v}</div><div class="m">${esc(r.gu)}${r.live && r.updatedAt ? ` · 기준 ${r.updatedAt}` : ""}${r.lat == null ? ' · <span class="badge muted">지도 위치 없음</span>' : ""}</div></button>`;
    }).join("");
  box.querySelectorAll("[data-gu]").forEach((el) => (el.onclick = () => { closeSearch(); goGu(el.dataset.gu); }));
  box.querySelectorAll("[data-code]").forEach((el) => (el.onclick = () => { closeSearch(); goLot(el.dataset.code); }));
}
function goGu(gu) {
  const pts = S.rows.filter((r) => r.gu === gu && r.lat != null);
  if (!map || !pts.length) { setView("list"); return; }
  setView("map");
  const b = new maplibregl.LngLatBounds();
  pts.forEach((r) => b.extend([r.lng, r.lat]));
  map.fitBounds(b, { padding: { top: 160, bottom: 260, left: 40, right: 40 }, pitch: reduced ? T.pitchReduced : T.pitch, bearing: T.bearing, duration: reduced ? 0 : T.dur.toResult, easing: EASE.camera, maxZoom: 15.5 });
}
function goLot(code) {
  const r = S.rows.find((x) => x.code === code);
  if (map && r.lat != null) {
    setView("map");
    map.flyTo({ center: [r.lng, r.lat], zoom: 15.6, pitch: reduced ? T.pitchReduced : T.pitch, bearing: T.bearing, duration: reduced ? 0 : T.dur.toResult, easing: EASE.camera, padding: { top: 0, bottom: 300, left: 0, right: 0 } });
  }
  openDetail(code);
}

// ---- 상세 시트 ----
function openDetail(code) {
  const r = S.rows.find((x) => x.code === code);
  if (!r) return;
  S.selected = code;
  const stale = isStale(r);
  const fee = r.paid
    ? [`기본 ${r.basicFee}원/${r.basicMin}분`, r.addFee ? `추가 ${r.addFee}원/${r.addMin}분` : null, r.dayMax ? `일 최대 ${r.dayMax}원` : null].filter(Boolean).join("<br>")
    : "무료";
  const big = r.live
    ? `<div class="big"><span class="lbl">빈자리</span><b>${r.vacant}</b> <span class="tot">/ 총 ${r.total}면</span><div class="tot" style="font-size:var(--fs-label)">현재 주차 ${r.parked}대</div></div>
       <div class="meta" style="font-size:var(--fs-label)">기준 ${r.updatedAt}${stale ? ' <span class="badge stale">오래됨</span>' : ""}</div>`
    : `<div class="big"><span class="badge muted">실시간 정보 없음</span> <span class="tot">총 ${r.total}면</span></div>
       <p class="note">이 주차장은 실시간 주차 대수를 보내지 않습니다. 요금과 운영시간만 보입니다</p>`;
  const dir = r.lat != null
    ? `<a class="btn primary press" href="https://map.kakao.com/link/to/${encodeURIComponent(r.name)},${r.lat},${r.lng}" target="_blank" rel="noopener">길찾기</a>`
    : `<span class="btn primary" aria-disabled="true" style="display:grid;place-items:center">길찾기</span>`;
  $("sheetBody").innerHTML = `
    <h2 id="sheetTitle">${esc(r.name)}</h2>
    <div class="addr">${esc(addr(r.addr))} · ${r.paid ? "유료" : "무료"}${r.lat == null ? ' · <span class="badge muted">지도 위치 없음</span>' : ""}</div>
    ${big}
    <dl>
      <div><dt>요금</dt><dd>${fee}</dd></div>
      <div><dt>운영시간</dt><dd>평일 ${hours(r.weekday)}<br>토요일 ${hours(r.sat)}<br>공휴일 ${hours(r.holiday)}</dd></div>
      ${r.tel ? `<div><dt>전화</dt><dd>${esc(r.tel)}</dd></div>` : ""}
    </dl>
    <div class="actions">
      ${r.tel ? `<a class="btn press" href="tel:${esc(r.tel)}">전화 걸기</a>` : "<span></span>"}
      ${dir}
    </div>
    <p class="note">${r.lat != null ? "외부 지도 앱에서 엽니다" : "원자료에 좌표가 없어 길찾기를 열 수 없습니다. 위 주소로 찾으세요"}</p>`;
  $("scrim").hidden = false;
  requestAnimationFrame(() => { $("scrim").classList.add("show"); $("sheet").classList.add("open"); });
  $("sheet").setAttribute("aria-hidden", "false");
  $("closeSheet").focus();
  placeLabels();
}
function closeDetail() {
  S.selected = null;
  $("sheet").classList.remove("open"); $("sheet").style.transform = "";
  $("scrim").classList.remove("show");
  $("sheet").setAttribute("aria-hidden", "true");
  setTimeout(() => ($("scrim").hidden = true), 320);
  placeLabels();
}
function dragSheet() {
  let y0 = null, dy = 0;
  const h = $("handle"), sh = $("sheet");
  h.addEventListener("pointerdown", (e) => { y0 = e.clientY; dy = 0; sh.style.transition = "none"; h.setPointerCapture(e.pointerId); });
  h.addEventListener("pointermove", (e) => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });
  h.addEventListener("pointerup", () => {
    sh.style.transition = ""; y0 = null;
    if (dy > 80) closeDetail(); else sh.style.transform = "";
  });
  h.addEventListener("click", () => { if (dy < 4) closeDetail(); });
}

// ---- 데이터 ----
async function load() {
  const res = await fetch("data/parkings.json", { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  return j.rows;
}
function showError(on) {
  const el = $("errorBanner");
  if (!on) { el.hidden = true; return; }
  el.innerHTML = `<b>주차장 정보를 불러오지 못했습니다</b>연결을 확인한 뒤 다시 시도하세요<br><button class="btn press" type="button" id="retry">다시 시도</button>`;
  el.hidden = false;
  $("retry").onclick = () => start();
}
async function refresh() {
  const btns = [$("refresh"), $("refresh2")];
  btns.forEach((b) => b.classList.add("spinning"));
  if (reduced) $("updated").textContent = "새로 받는 중";
  const prev = new Map(S.rows.map((r) => [r.code, r]));
  try {
    const rows = await load();
    S.rows = rows; S.maxVac = Math.max(1, ...rows.filter((r) => r.live).map((r) => r.vacant));
    if (map) {
      // 높이 전환(standard 600ms): 이전 높이 → 새 높이
      const from = (r) => (prev.get(r.code) ? columnPx(prev.get(r.code)) : 0), to = (r) => columnPx(r);
      if (reduced) setColumns(() => 1);
      else {
        const t0 = performance.now();
        const step = (now) => {
          const p = EASE.standard(Math.min(1, (now - t0) / T.dur.height));
          setColumns((r) => { const t = to(r) || 1; return (from(r) + (to(r) - from(r)) * p) / t; });
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
    }
    if (S.view === "list") renderList();
  } catch {
    toast("새로 받지 못했습니다. 이전 기준 시각의 숫자입니다");
  } finally {
    btns.forEach((b) => b.classList.remove("spinning"));
    renderUpdated();
  }
}

// ---- 위치 ----
function locate() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition((p) => resolve([p.coords.longitude, p.coords.latitude]), () => resolve(null), { timeout: 6000, maximumAge: 60000 });
  });
}
function setLocateDisabled(off) {
  const b = $("locate");
  b.setAttribute("aria-disabled", off ? "true" : "false");
  b.setAttribute("aria-label", off ? "현위치로 이동, 위치 권한 꺼짐" : "현위치로 이동");
  b.querySelector(".slash").style.display = off ? "" : "none";
  $("sDist").disabled = off || !S.user;
}

// ---- 시작 ----
let started = false;
async function start() {
  showError(false);
  $("veil").classList.remove("gone"); $("veil").textContent = "불러오는 중";
  let rows;
  try { rows = await load(); } catch {
    $("veil").classList.add("gone"); showError(true); if (!map) { setView("list"); $("listBody").innerHTML = ""; } return;
  }
  S.rows = rows;
  S.maxVac = Math.max(1, ...rows.filter((r) => r.live).map((r) => r.vacant));
  if (started) { $("veil").classList.add("gone"); refresh(); return; }
  started = true;

  if (!webglOK()) {
    S.view = "list";
    $("tMap").disabled = $("tMap2").disabled = true;
    $("veil").classList.add("gone");
    setView("list");
    toast("이 기기에서는 3D 지도를 쓸 수 없어 목록으로 시작합니다");
    return;
  }

  const userP = locate();
  map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/positron",
    center: SEOUL, zoom: 10.3, pitch: 0, bearing: 0,
    attributionControl: false, maxPitch: 70,
    localIdeographFontFamily: "'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif",
  });
  map.on("error", (e) => console.warn(e.error || e));
  map.on("load", async () => {
    styleMap();
    const arriveZoom = 14.6, pitch = reduced ? T.pitchReduced : T.pitch;
    S.heightM = pxToMetersAt(arriveZoom, CITY_HALL[1], pitch);
    addColumnLayers();
    $("veil").classList.add("gone");
    const user = await userP;
    S.user = user; S.geoDenied = !user;
    setLocateDisabled(!user);
    const dest = user && distM(user, CITY_HALL) < 40000 ? user : ARRIVE;
    if (!user) toast("위치를 쓸 수 없어 시청 근처로 시작합니다");
    const cam = { center: dest, zoom: arriveZoom, pitch, bearing: T.bearing, padding: { top: 160, bottom: 200, left: 0, right: 0 } };
    if (reduced) { map.jumpTo(cam); riseColumns(); }
    else {
      map.flyTo({ ...cam, duration: T.dur.flight, easing: EASE.camera, essential: false });
      map.once("moveend", () => riseColumns());
    }
    renderUpdated();
  });
  for (const ev of ["move", "zoom", "pitch", "rotate", "resize"]) map.on(ev, placeLabels);
  map.on("moveend", () => { renderUpdated(); if (S.view === "list") renderList(); });
  map.on("click", (e) => {
    const hit = map.queryRenderedFeatures(e.point, { layers: ["columns-fresh", "columns-stale"] });
    if (!hit.length && S.selected) closeDetail();
  });
}

// ---- 이벤트 ----
$("tMap").onclick = $("tMap2").onclick = () => setView("map");
$("tList").onclick = $("tList2").onclick = () => setView("list");
$("sVac").onclick = () => { S.sort = "vacancy"; syncToggles(); renderList(); };
$("sDist").onclick = () => { if (!S.user) return; S.sort = "distance"; syncToggles(); renderList(); };
$("openSearch").onclick = $("openSearch2").onclick = openSearch;
$("closeSearch").onclick = closeSearch;
$("q").addEventListener("input", (e) => renderResults(e.target.value));
$("refresh").onclick = $("refresh2").onclick = refresh;
$("locate").onclick = () => {
  if (!S.user) { toast("위치 권한이 꺼져 있어 현위치를 쓸 수 없습니다"); return; }
  map && map.easeTo({ center: S.user, duration: reduced ? 0 : T.dur.toResult, easing: EASE.camera });
};
$("closeSheet").onclick = closeDetail;
$("scrim").onclick = closeDetail;
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (!$("search").hidden) closeSearch(); else if (S.selected) closeDetail();
});
addEventListener("resize", () => { syncToggles(); placeLabels(); });
dragSheet();
if (document.fonts) document.fonts.ready.then(syncToggles);
syncToggles();
listSkeleton();
start();
</script>
</body>
</html>
