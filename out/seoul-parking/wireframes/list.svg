<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800">
<rect width="100%" height="100%" fill="#FFF"/>
<rect x="8" y="4" width="344" height="40" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
<text x="20" y="28" font-size="12" font-family="sans-serif" fill="#111">6. 헤더·새로고침 — <tspan fill="#555">서울 공영주차장 빈자리 · 새로고침(44px)</tspan></text>
<rect x="8" y="52" width="344" height="48" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="4"/>
<text x="20" y="74" font-size="13" font-family="sans-serif" fill="#111">2. 이름·주소 검색</text>
<text x="20" y="94" font-size="12" font-family="sans-serif" fill="#555">주차장 이름·주소 검색 (예: 세종로)</text>
<rect x="8" y="108" width="344" height="48" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="3"/>
<text x="20" y="130" font-size="13" font-family="sans-serif" fill="#111">3. 구 필터 칩(가로 스크롤)</text>
<text x="20" y="150" font-size="12" font-family="sans-serif" fill="#555">전체 · 종로구 · 중구 · 영등포구 … 23개 구</text>
<rect x="8" y="164" width="344" height="36" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
<text x="20" y="186" font-size="12" font-family="sans-serif" fill="#111">5. 결과 건수·기준 — <tspan fill="#555">총 122곳 · 목록 불러온 시각 표시</tspan></text>
<rect x="8" y="208" width="344" height="56" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="2"/>
<text x="20" y="230" font-size="13" font-family="sans-serif" fill="#111">4. 오래됨 경고(20분 초과 시)</text>
<text x="20" y="250" font-size="12" font-family="sans-serif" fill="#555">기준 시각이 20분 넘게 지났어요. 새로고침 [버튼]</text>
<rect x="8" y="272" width="344" height="32" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
<text x="20" y="292" font-size="12" font-family="sans-serif" fill="#111">9. 구 묶음 제목 — <tspan fill="#555">종로구 16곳 (구별 묶음)</tspan></text>
<rect x="8" y="312" width="344" height="88" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="5"/>
<text x="20" y="334" font-size="13" font-family="sans-serif" fill="#111">1. 행: 실시간 연계</text>
<text x="20" y="354" font-size="12" font-family="sans-serif" fill="#555">PKLT_NM / 종로구 ADDR / 빈 {TPKCT-NOW}/{TPKCT}면 · 기준</text>
<rect x="8" y="408" width="344" height="88" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
<text x="20" y="430" font-size="13" font-family="sans-serif" fill="#111">7. 행: 실시간 미연계</text>
<text x="20" y="450" font-size="12" font-family="sans-serif" fill="#555">PKLT_NM / ADDR / 실시간 정보 없음 (0 아님)</text>
<rect x="8" y="504" width="344" height="88" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
<text x="20" y="526" font-size="13" font-family="sans-serif" fill="#111">8. 행: 버스전용</text>
<text x="20" y="546" font-size="12" font-family="sans-serif" fill="#555">PKLT_NM / ADDR / [버스전용] 승용차 해당 없음</text>
<rect x="8" y="600" width="344" height="112" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
<text x="20" y="622" font-size="13" font-family="sans-serif" fill="#111">10. 상태 영역(대체 표시)</text>
<text x="20" y="642" font-size="12" font-family="sans-serif" fill="#555">불러오는 중 · 실패: 다시 시도 · 결과 없음</text>
<rect x="8" y="720" width="344" height="64" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
<text x="20" y="742" font-size="13" font-family="sans-serif" fill="#111">11. 하단 출처</text>
<text x="20" y="762" font-size="12" font-family="sans-serif" fill="#555">출처: 서울 열린데이터광장, 서울시 시영주차장 실시간 주차대수 정보 (공공누리 1유형)</text>

</svg>
