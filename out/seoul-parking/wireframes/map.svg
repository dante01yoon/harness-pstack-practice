<text x="20" y="446" font-size="12" font-family="sans-serif" fill="#555">플레이스홀더 '주차장 이름·구 검색 (예: 세종로, 종로구)'. 탭하면 검색 화면.</text>
<rect x="8" y="460" width="374" height="40" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="3"/>
<text x="20" y="484" font-size="12" font-family="sans-serif" fill="#111">3. 지도/목록 알약 토글 — <tspan fill="#555">[지도 | 목록] 현재 '지도'가 채워짐. WebGL 없으면 </tspan></text>
