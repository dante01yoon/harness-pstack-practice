<text x="20" y="530" font-size="13" font-family="sans-serif" fill="#111">4. 현위치·새로고침 버튼</text>
<text x="20" y="550" font-size="12" font-family="sans-serif" fill="#555">우측 하단 엄지 영역 원형 버튼 2개. 새로고침 옆에 '기준 2026-10-28 00:</text>
<rect x="8" y="564" width="374" height="48" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
