<text x="20" y="640" font-size="12" font-family="sans-serif" fill="#111">6. 저작권 칩 — <tspan fill="#555">서울 열린데이터광장 · © OpenFreeMap © OpenM</tspan></text>
<rect x="8" y="660" width="374" height="180" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
