<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<rect width="100%" height="100%" fill="#FFF"/>
<rect x="8" y="4" width="374" height="56" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="5"/>
<text x="20" y="26" font-size="13" font-family="sans-serif" fill="#111">1. 검색 입력 + 닫기</text>
<text x="20" y="46" font-size="12" font-family="sans-serif" fill="#555">입력 '세종로' · 자동 포커스 · 이름과 자치구만 검색 안내 '주소·장소는 검색하지 </text>
<rect x="8" y="68" width="374" height="88" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="4"/>
<text x="20" y="90" font-size="13" font-family="sans-serif" fill="#111">2. 결과: 주차장 이름</text>
<text x="20" y="110" font-size="12" font-family="sans-serif" fill="#555">세종로 공영주차장(시) 종로구 · 빈자리 1067 / 총 1260면 · 기준 2026-</text>
<rect x="8" y="164" width="374" height="64" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="3"/>
<text x="20" y="186" font-size="13" font-family="sans-serif" fill="#111">3. 결과: 자치구</text>
<text x="20" y="206" font-size="12" font-family="sans-serif" fill="#555">종로구 · 주차장 —곳. 탭하면 지도가 구 전체로 이동.</text>
<rect x="8" y="236" width="374" height="112" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="2"/>
<text x="20" y="258" font-size="13" font-family="sans-serif" fill="#111">4. 결과 변형: 실시간 없음 / 위치 정보 없음</text>
<text x="20" y="278" font-size="12" font-family="sans-serif" fill="#555">실시간 없음: 숫자 대신 '실시간 정보 없음'. 위치 정보 없음: 탭하면 지도 대신 상</text>
<rect x="8" y="356" width="374" height="152" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
<text x="20" y="378" font-size="13" font-family="sans-serif" fill="#111">5. 결과 없음 상태</text>
<text x="20" y="398" font-size="12" font-family="sans-serif" fill="#555">'‘—’에 맞는 주차장이나 구가 없습니다' + 이름 또는 구 이름으로 다시 검색 안내.</text>
<rect x="8" y="516" width="374" height="324" rx="6" fill="#F2F2F2" stroke="#333" stroke-width="1"/>
<text x="20" y="538" font-size="13" font-family="sans-serif" fill="#111">6. 움직임 주석</text>
<text x="20" y="558" font-size="12" font-family="sans-serif" fill="#555">결과 탭 시 검색 화면이 닫히고 카메라가 해당 주차장 또는 구 전체로 날아감, 도착 후</text>

</svg>
